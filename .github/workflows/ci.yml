name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # SPEC.md §14.5 — golden test là lưới an toàn cho M2 (tái lập byte-for-byte).
      # Đỏ ở đây là chặn merge, kể cả khi kết quả mới "trông hợp lý hơn" (CLAUDE.md §4).
      - name: Test + golden
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      # Test chạy trên `src/`, nên một bản build hỏng vẫn có thể xanh hết bảng. Bước này
      # khởi động ĐÚNG thứ sẽ đem đi chạy: seed → server → đăng nhập → tRPC trả dữ liệu.
      # Nó bắt được đúng lớp lỗi mà unit test mù: thiếu `.sql`/`.json` trong `dist/`.
      - name: Smoke (ban build)
        run: npm run smoke
